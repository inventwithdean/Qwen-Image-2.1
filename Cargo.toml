[package]
name = "qwen-image"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "0.22", features = ["std", "wgpu", "fusion"], default-features = false }
burn-store = "0.22"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
js-sys = "0.3.106"
safetensors = "0.8.0"
serde = "1.0.229"
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[dependencies.web-sys]
version = "0.3.106"
features = ["console"]

[patch.crates-io]
burn-cubecl = { path = "vendor/burn-cubecl-0.22.0" }