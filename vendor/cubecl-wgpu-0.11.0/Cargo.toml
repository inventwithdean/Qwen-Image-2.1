[package]
edition = "2024"
name = "cubecl-wgpu"
version = "0.11.0"
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "WGPU runtime for the CubeCL"
readme = "README.md"
keywords = [
    "gpu",
    "wgpu",
    "webgpu",
    "gpgpu",
]
categories = ["science"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-wgpu"
resolver = "2"

[features]
default = [
    "cubecl-server/default",
    "cubecl-common/default",
    "cubecl-core/default",
]
deny-validation-errors = ["wgpu-hal/validation_canary"]
exclusive-memory-only = ["cubecl-server/exclusive-memory-only"]
msl = [
    "cubecl-cpp/metal",
    "dep:objc2",
    "dep:objc2-foundation",
]
persistence = ["cubecl-server/persistence"]
pliron-dump = [
    "std",
    "cubecl-cpp/pliron-dump",
    "cubecl-spirv?/pliron-dump",
]
profile-tracy = ["tracy-client"]
renderdoc = [
    "std",
    "dep:renderdoc",
]
spirv = [
    "cubecl-spirv",
    "ash",
    "tracel-ash",
    "cubecl-common/hash",
]
std = [
    "cubecl-server/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-cpp/std",
    "cubecl-opt/std",
    "pliron/std",
    "sanitize-filename",
]
tracing = [
    "dep:tracing",
    "cubecl-server/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]
vulkan-validate = []

[lib]
name = "cubecl_wgpu"
path = "src/lib.rs"

[[example]]
name = "graph_bench"
path = "examples/graph_bench.rs"

[[test]]
name = "device"
path = "tests/device.rs"

[[test]]
name = "device_poisoned"
path = "tests/device_poisoned.rs"

[[test]]
name = "graph"
path = "tests/graph.rs"

[[test]]
name = "launch_errors"
path = "tests/launch_errors.rs"

[[test]]
name = "profile_window"
path = "tests/profile_window.rs"

[[test]]
name = "relocation"
path = "tests/relocation.rs"

